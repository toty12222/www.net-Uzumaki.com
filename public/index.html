<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net-Uzumaki - Streaming Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 15px 40px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent);
            display: flex; align-items: center; justify-content: space-between;
        }
        header h1 { color: #e50914; font-size: 28px; font-weight: bold; letter-spacing: -1px; }
        header span { color: #fff; font-size: 14px; opacity: 0.7; }
        main { padding-top: 70px; }
        .row { padding: 20px 40px; }
        .row h2 { font-size: 20px; margin-bottom: 12px; font-weight: 600; }
        .row-items { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scroll-behavior: smooth; }
        .row-items::-webkit-scrollbar { height: 6px; }
        .row-items::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .card {
            flex: 0 0 auto; width: 160px; cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 6px; overflow: hidden; background: #222;
        }
        .card:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 8px 30px rgba(0,0,0,0.7); }
        .card img { width: 100%; height: 240px; object-fit: cover; display: block; }
        .card .info { padding: 8px 10px; }
        .card .info .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .info .rating { font-size: 11px; color: #46d369; margin-top: 4px; }
        .loading { text-align: center; padding: 80px 40px; color: #888; font-size: 18px; }
        .error { text-align: center; padding: 80px 40px; color: #e50914; font-size: 16px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #181818; border-radius: 12px; max-width: 800px; width: 100%;
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .modal .close {
            position: absolute; top: 12px; right: 16px; font-size: 28px;
            cursor: pointer; color: #fff; z-index: 5; background: #181818;
            border: none; line-height: 1;
        }
        .modal .trailer { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px 12px 0 0; overflow: hidden; }
        .modal .trailer iframe { width: 100%; height: 100%; border: none; }
        .modal .details { padding: 20px 28px; }
        .modal .details h2 { font-size: 24px; margin-bottom: 10px; }
        .modal .details .score { color: #46d369; font-weight: bold; margin-bottom: 12px; }
        .modal .details p { line-height: 1.6; color: #ccc; font-size: 15px; }
        .modal .no-trailer { display: flex; align-items: center; justify-content: center; aspect-ratio: 16/9; color: #666; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <h1>NET-UZUMAKI</h1>
        <span>Streaming Store</span>
    </header>
    <main>
        <div id="content">
            <div class="loading">Carregando conteúdo...</div>
        </div>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <button class="close" onclick="closeModal()">&times;</button>
            <div class="trailer" id="trailer-container"></div>
            <div class="details" id="modal-details"></div>
        </div>
    </div>

    <script>
        let contentData = [];

        async function loadContent() {
            try {
                const res = await fetch('/api/content');
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Erro ao carregar conteúdo');
                }
                const data = await res.json();
                contentData = data.rows;
                renderRows(data.rows);
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="error">' + e.message + '</div>';
            }
        }

        function renderRows(rows) {
            const container = document.getElementById('content');
            container.innerHTML = '';
            rows.forEach(row => {
                if (!row.items.length) return;
                const section = document.createElement('section');
                section.className = 'row';
                section.innerHTML = '<h2>' + escapeHtml(row.title) + '</h2>';
                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'row-items';
                row.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML =
                        '<img src="' + item.image + '" alt="' + escapeHtml(item.title) + '" loading="lazy">' +
                        '<div class="info"><div class="title">' + escapeHtml(item.title) + '</div>' +
                        '<div class="rating">★ ' + item.vote_average.toFixed(1) + '</div></div>';
                    card.onclick = () => openModal(item);
                    itemsDiv.appendChild(card);
                });
                section.appendChild(itemsDiv);
                container.appendChild(section);
            });
        }

        async function openModal(item) {
            const modal = document.getElementById('modal');
            const trailerContainer = document.getElementById('trailer-container');
            const details = document.getElementById('modal-details');
            trailerContainer.innerHTML = '<div class="no-trailer">Carregando trailer...</div>';
            details.innerHTML = '<h2>' + escapeHtml(item.title) + '</h2><div class="score">★ ' + item.vote_average.toFixed(1) + '/10</div><p>' + escapeHtml(item.overview) + '</p>';
            modal.classList.add('active');

            try {
                const res = await fetch('/api/trailer/' + item.type + '/' + item.id);
                const data = await res.json();
                if (data.key) {
                    trailerContainer.innerHTML = '<iframe src="https://www.youtube.com/embed/' + data.key + '" allowfullscreen allow="autoplay; encrypted-media"></iframe>';
                } else {
                    trailerContainer.innerHTML = '<div class="no-trailer">Trailer não disponível</div>';
                }
            } catch {
                trailerContainer.innerHTML = '<div class="no-trailer">Erro ao carregar trailer</div>';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('trailer-container').innerHTML = '';
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        loadContent();
    </script>
</body>
</html>
